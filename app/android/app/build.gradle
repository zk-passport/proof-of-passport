apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'

def parseArchitectures = { value ->
    value.toString().split(",").collect { it.trim() }.findAll { it }
}


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    root = file("../..")
    //   The folder where the react-native NPM package is.
    reactNativeDir = file("../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is.
    codegenDir = file("../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint.
    cliFile = file("../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    if (System.env.E2E_BUILD == "true") {
        // For E2E/CI builds: bundle JS into the debug APK (no Metro server available)
        debuggableVariants = []
    }
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    // Resolve hermesc from the workspace-root node_modules.
    //
    // Layout post-RN-0.83 upgrade with pnpm hoisted linker:
    //   <repo-root>/node_modules/hermes-compiler/hermesc/<platform>-bin/hermesc
    //
    // Notes:
    //   - In RN <= 0.82 the binary lived under react-native/sdks/hermesc/...;
    //     in 0.83+ it ships as the separate `hermes-compiler` package.
    //   - rootProject.projectDir is app/android; ../../node_modules is the
    //     workspace root where pnpm hoists everything.
    //   - We fail loudly in CI rather than silently falling back to PATH —
    //     a wrong fallback previously shipped a non-Hermes bundle and broke E2E.
    hermesCommand = {
        def hermescRoot = file("${rootProject.projectDir}/../../node_modules/hermes-compiler/hermesc").absolutePath
        def osName = System.getProperty('os.name').toLowerCase()
        def platformDir
        def executableName = "hermesc"

        if (osName.contains('mac')) {
            platformDir = "osx-bin"
        } else if (osName.contains('linux')) {
            platformDir = "linux64-bin"
        } else if (osName.contains('windows')) {
            platformDir = "win64-bin"
            executableName = "hermesc.exe"
        } else {
            platformDir = "linux64-bin"
        }

        def dynamicPath = "${hermescRoot}/${platformDir}/${executableName}"
        def isCi = System.env.CI == "true" || System.env.GITHUB_ACTIONS == "true"

        if (new File(dynamicPath).exists()) {
            println "[hermesCommand] Using bundled hermesc: ${dynamicPath}"
            return dynamicPath
        } else if (isCi) {
            throw new GradleException(
                "[hermesCommand] Bundled hermesc not found at ${dynamicPath} (platform=${platformDir}). " +
                "Refusing to fall back to PATH in CI — ensure `hermes-compiler` is installed at the workspace root node_modules."
            )
        } else {
            println "[hermesCommand] WARN: ${dynamicPath} missing; falling back to PATH 'hermesc' (local dev only)"
            return "hermesc"
        }
    }()

    // The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    namespace "com.proofofpassportapp"

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    sourceSets {
        main {
            assets.srcDirs += [
                "../../node_modules/@selfxyz/rn-sdk/assets",
            ]
        }
    }

    defaultConfig {
        applicationId "com.proofofpassportapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 175
        versionName "2.9.30"
        manifestPlaceholders = [appAuthRedirectScheme: 'com.proofofpassportapp']
        // Tesseract OCR fallback when ML Kit yields no check-digit-valid MRZ (SELF-3447).
        buildConfigField "boolean", "TESSERACT_MRZ_FALLBACK", "true"
        // Route every frame through Tesseract; ML Kit runs only as the MRZ band locator.
        // Test/rollout mode — keep false until field telemetry justifies the flip.
        buildConfigField "boolean", "TESSERACT_MRZ_PRIMARY", "false"
        externalNativeBuild {
            cmake {
                cppFlags += "-fexceptions -frtti -std=c++11"
                arguments += "-DANDROID_STL=c++_shared"
                arguments += "-Wl,-z,max-page-size=16384"
                arguments += "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"

            }
            ndk {
                if (System.env.E2E_BUILD == "true") {
                    abiFilters "x86_64"
                } else if (project.hasProperty("selfAppArchitectures")) {
                    abiFilters(*parseArchitectures(project.getProperty("selfAppArchitectures")))
                } else {
                    abiFilters "arm64-v8a", "x86_64"
                }
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            } else {
                // Fallback to debug signing for CI/local testing
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            // Use legacy packaging (compressed, extracted at install) to ensure
            // 16 KB page alignment — the OS aligns .so files during extraction.
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so']
        }
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

configurations.all {
    resolutionStrategy {
        // expo-camera hardcodes mlkit barcode-scanning 17.2.0 which ships
        // a non-16KB-page-aligned libbarhopper_v3.so — force 17.3.0
        force 'com.google.mlkit:barcode-scanning:17.3.0'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation(project(":react-native-passport-reader")) {
        exclude group: 'edu.ucar', module: 'jj2000'
    }
    implementation project(':passportreader')
    implementation 'org.jmrtd:jmrtd:0.7.35'

    implementation 'com.github.blikoon:QRCodeScanner:0.1.2'

    // e-Aadhaar PDF decrypt + rasterize (pure-JVM, ships no .so -> no 16KB alignment impact).
    // Exclude its bundled bouncycastle (jdk15to18:1.72): it duplicates the app's existing
    // bouncycastle jdk18on:1.80 (same org.bouncycastle.* classes) and fails the dex merge.
    // Reuse the app's newer bouncycastle instead, adding bcpkix for pdfbox's crypto.
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
        exclude group: 'org.bouncycastle'
    }
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    // ML Kit barcode scanner: localizes + decodes the dense Secure QR inside the
    // cluttered e-Aadhaar page (ZXing needs an isolated QR). Version matches the
    // one already resolved transitively.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Firebase Dependencies
    implementation platform('com.google.firebase:firebase-bom:32.7.3')
    implementation 'com.google.firebase:firebase-messaging'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation("net.java.dev.jna:jna:5.16.0@aar")
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android'

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-common:19.1.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation "com.github.fotoapparat:fotoapparat:2.7.0"

    implementation "androidx.concurrent:concurrent-futures:1.1.0"
    implementation "com.google.guava:guava:31.1-android"
    implementation "androidx.profileinstaller:profileinstaller:1.3.1"

    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "com.google.android.material:material:1.12.0"

    implementation "com.google.android.play:app-update:2.1.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.15.1"
    testImplementation "androidx.test:core:1.6.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
