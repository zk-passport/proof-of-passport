name: Mobile E2E

permissions:
  contents: read

env:
  # Build environment versions
  JAVA_VERSION: 17
  ANDROID_API_LEVEL: 34
  ANDROID_NDK_VERSION: 28.0.13004108
  XCODE_VERSION: 26
  NODE_OPTIONS: --max-old-space-size=8192
  # Cache versions
  GH_CACHE_VERSION: v2 # Global cache version - bumped to invalidate caches
  GH_GEMS_CACHE_VERSION: v1 # Ruby gems cache version
  # Performance optimizations
  GRADLE_OPTS: -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
  CI: true
  # Disable Maestro analytics in CI
  MAESTRO_CLI_NO_ANALYTICS: true
  MAESTRO_VERSION: 1.41.0
  MAESTRO_CACHE_VERSION: v1 # Bump this to clear Maestro cache
  # Debug-only Didit native module bypass for E2E autolinking.
  # Keep false by default; set true only when isolating Didit-specific build failures.
  DIDIT_E2E_BYPASS: ${{ github.event.inputs.didit_e2e_bypass == 'true' && 'true' || 'false' }}
  # Maestro recording/artifacts. Default off to reduce CI overhead.
  # Enable only when debugging by setting ENABLE_MAESTRO_RECORDING=true.
  ENABLE_MAESTRO_RECORDING: false

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - "app/**"
      - "packages/mobile-sdk-alpha/**"
      - "pnpm-patches/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-e2e.yml"
      - ".github/CI_FORCE_RUN"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "app/**"
      - "packages/mobile-sdk-alpha/**"
      - "pnpm-patches/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-e2e.yml"
      - ".github/CI_FORCE_RUN"
  workflow_dispatch:
    inputs:
      didit_e2e_bypass:
        description: "Disable Didit RN native module autolinking for this run (debug only)"
        required: false
        default: false
        type: boolean

jobs:
  e2e-android:
    if: >
      github.event_name != 'pull_request' ||
      contains(fromJSON('["dev","staging","main"]'), github.base_ref) ||
      contains(github.event.pull_request.labels.*.name, 'test-e2e')
    concurrency:
      group: ${{ github.workflow }}-android-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 120
    runs-on:
      - "self-hosted"
      - "selfxyz-org"
      - "ubuntu-24-04"
    steps:
      - uses: actions/checkout@v6
      - name: Read and sanitize Node.js version
        shell: bash
        run: |
          if [ ! -f .nvmrc ] || [ -z "$(cat .nvmrc)" ]; then
            echo "❌ .nvmrc is missing or empty"; exit 1;
          fi
          VERSION="$(tr -d '\r\n' < .nvmrc)"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid .nvmrc content: '$VERSION'"; exit 1;
          fi
          echo "NODE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NODE_VERSION_SANITIZED=${VERSION//\//-}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm
        with:
          cache-version: ${{ env.GH_CACHE_VERSION }}-node-${{ env.NODE_VERSION_SANITIZED }}
      - name: Generate token for self repositories
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: ./.github/actions/generate-github-token
        id: github-token
        with:
          app-id: ${{ vars.GH_WORKFLOWS_CROSS_ACCESS_ID }}
          private-key: ${{ secrets.GH_WORKFLOWS_CROSS_ACCESS_KEY }}
          configure-netrc: "true"
      - name: Check for nested require() in tests
        uses: ./.github/actions/check-nested-requires
        with:
          paths: |
            app/tests/
      - name: Install deps (internal PRs and protected branches)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        shell: bash
        env:
          SELFXYZ_APP_TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          set -euo pipefail

          log_resources() {
            echo "=== Runner resource snapshot ($1) ==="
            free -h || true
            df -h / || true
            nproc || true

            if [ -f /sys/fs/cgroup/memory.current ]; then
              echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current)"
            fi
            if [ -f /sys/fs/cgroup/memory.max ]; then
              echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max)"
            fi
            if [ -f /sys/fs/cgroup/memory.events ]; then
              echo "cgroup memory.events:"
              cat /sys/fs/cgroup/memory.events || true
            fi

            echo "=== dmesg OOM check ==="
            dmesg 2>/dev/null | grep -i "oom\|killed process\|out of memory" | tail -5 || true
            echo "=== End resource snapshot ==="
          }

          check_network() {
            echo "Checking network prerequisites for pnpm install..."
            for host in github.com api.github.com registry.npmjs.org repo.maven.apache.org; do
              echo "Resolving ${host}..."
              getent hosts "${host}" || true
            done
          }

          monitored_install() {
            log_resources "pre-install"
            check_network

            (
              while true; do
                timestamp="$(date -u +%H:%M:%S)"
                mem_line="$(free -h | awk '/^Mem:/{print "Mem: used="$3" free="$4" avail="$7}')"
                disk_line="$(df -h / | awk 'NR==2{print "Disk: used="$3" avail="$4}')"
                cgroup_current="$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo n/a)"
                cgroup_max="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
                oom_events="$(tr '\n' ' ' < /sys/fs/cgroup/memory.events 2>/dev/null || echo n/a)"
                echo "[resource-monitor] ${timestamp} | ${mem_line} | ${disk_line} | cgroup.current=${cgroup_current} cgroup.max=${cgroup_max} | memory.events=${oom_events}"
                sleep 30
              done
            ) &
            MONITOR_PID=$!
            trap 'kill "${MONITOR_PID}" 2>/dev/null || true' EXIT

            for attempt in 1 2 3; do
              echo "Starting pnpm install attempt ${attempt}/3..."
              if timeout 20m pnpm install --frozen-lockfile; then
                echo "pnpm install completed successfully on attempt ${attempt}."
                kill "${MONITOR_PID}" 2>/dev/null || true
                trap - EXIT
                return 0
              else
                exit_code=$?
              fi

              echo "pnpm install failed on attempt ${attempt} with exit code ${exit_code}."
              log_resources "post-failure"

              if [ "${attempt}" -eq 3 ]; then
                kill "${MONITOR_PID}" 2>/dev/null || true
                trap - EXIT
                return "${exit_code}"
              fi

              echo "Retrying in 5 seconds..."
              sleep 5
            done
          }

          monitored_install
      - name: Install deps (forked PRs - no secrets)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        shell: bash
        run: |
          set -euo pipefail

          log_resources() {
            echo "=== Runner resource snapshot ($1) ==="
            free -h || true
            df -h / || true
            nproc || true

            if [ -f /sys/fs/cgroup/memory.current ]; then
              echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current)"
            fi
            if [ -f /sys/fs/cgroup/memory.max ]; then
              echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max)"
            fi
            if [ -f /sys/fs/cgroup/memory.events ]; then
              echo "cgroup memory.events:"
              cat /sys/fs/cgroup/memory.events || true
            fi

            echo "=== dmesg OOM check ==="
            dmesg 2>/dev/null | grep -i "oom\|killed process\|out of memory" | tail -5 || true
            echo "=== End resource snapshot ==="
          }

          check_network() {
            echo "Checking network prerequisites for pnpm install..."
            for host in github.com api.github.com registry.npmjs.org repo.maven.apache.org; do
              echo "Resolving ${host}..."
              getent hosts "${host}" || true
            done
          }

          monitored_install() {
            log_resources "pre-install"
            check_network

            (
              while true; do
                timestamp="$(date -u +%H:%M:%S)"
                mem_line="$(free -h | awk '/^Mem:/{print "Mem: used="$3" free="$4" avail="$7}')"
                disk_line="$(df -h / | awk 'NR==2{print "Disk: used="$3" avail="$4}')"
                cgroup_current="$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo n/a)"
                cgroup_max="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
                oom_events="$(tr '\n' ' ' < /sys/fs/cgroup/memory.events 2>/dev/null || echo n/a)"
                echo "[resource-monitor] ${timestamp} | ${mem_line} | ${disk_line} | cgroup.current=${cgroup_current} cgroup.max=${cgroup_max} | memory.events=${oom_events}"
                sleep 30
              done
            ) &
            MONITOR_PID=$!
            trap 'kill "${MONITOR_PID}" 2>/dev/null || true' EXIT

            for attempt in 1 2 3; do
              echo "Starting pnpm install attempt ${attempt}/3..."
              if timeout 20m pnpm install --frozen-lockfile; then
                echo "pnpm install completed successfully on attempt ${attempt}."
                kill "${MONITOR_PID}" 2>/dev/null || true
                trap - EXIT
                return 0
              else
                exit_code=$?
              fi

              echo "pnpm install failed on attempt ${attempt} with exit code ${exit_code}."
              log_resources "post-failure"

              if [ "${attempt}" -eq 3 ]; then
                kill "${MONITOR_PID}" 2>/dev/null || true
                trap - EXIT
                return "${exit_code}"
              fi

              echo "Retrying in 5 seconds..."
              sleep 5
            done
          }

          monitored_install

      - name: Validate Maestro test file
        run: |
          [ -f app/tests/e2e/launch.android.flow.yaml ] || { echo "❌ Android E2E test file missing"; exit 1; }
      - name: Cache Maestro
        id: cache-maestro
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro-${{ env.MAESTRO_VERSION }}
      - name: Check Java installation
        run: |
          echo "INSTALL_JAVA=false" >> "$GITHUB_ENV"
          if command -v java &> /dev/null && java -version &> /dev/null; then
            echo "Java already installed: $(java -version 2>&1 | head -n 1)"
          else
            echo "Java not found or not working, will install..."
            echo "INSTALL_JAVA=true" >> "$GITHUB_ENV"
          fi
      - name: Setup Java environment
        if: env.INSTALL_JAVA == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to path
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Free up disk space
        if: false # We should be fine for self-hosted
        uses: ./.github/actions/free-disk-space
      - name: Cache Gradle packages
        uses: ./.github/actions/cache-gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # The default package list includes the legacy 'tools' package, which
          # Google removed from the SDK repository; sdkmanager now fails on it.
          packages: platform-tools

      - name: Install NDK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build dependencies (outside emulator)
        run: |
          echo "Building dependencies..."
          corepack enable
          pnpm --filter @selfxyz/mobile-app run build:deps || { echo "❌ Dependency build failed"; exit 1; }
          echo "✅ Dependencies built successfully"
      - name: Setup Android private modules
        run: |
          cd app
          PLATFORM=android node scripts/setup-private-modules.cjs
        env:
          SELFXYZ_APP_TOKEN: ${{ steps.github-token.outputs.token }}
          CI: true

      - name: Capture private module SHAs for APK cache key
        run: |
          set -euo pipefail
          : > .apk-cache-inputs.txt
          for dir in app/android/android-passport-nfc-reader app/android/react-native-passport-reader; do
            if [ -d "$dir/.git" ]; then
              sha=$(git -C "$dir" rev-parse HEAD)
              echo "$(basename "$dir")=$sha" >> .apk-cache-inputs.txt
            fi
          done
          cat .apk-cache-inputs.txt

      - name: Stage APK path for cache restore
        run: rm -f app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Restore Android APK cache
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ runner.os }}-apk-v2-${{ hashFiles('app/android/app/src/**', 'app/android/app/build.gradle', 'app/android/app/proguard-rules.pro', 'app/android/build.gradle', 'app/android/settings.gradle', 'app/android/gradle.properties', 'app/android/gradle/wrapper/**', 'app/android/gradlew', 'app/src/**', 'app/App.tsx', 'app/index.js', 'app/app.json', 'app/package.json', 'app/babel.config.cjs', 'app/metro.config.cjs', 'app/react-native.config.cjs', 'pnpm-patches/**', 'pnpm-workspace.yaml', 'packages/mobile-sdk-alpha/src/**', 'packages/mobile-sdk-alpha/package.json', 'pnpm-lock.yaml', '.nvmrc', '.apk-cache-inputs.txt') }}

      - name: Publish KMP SDK to mavenLocal
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x packages/kmp-sdk/gradlew
          cd packages/kmp-sdk && ./gradlew :shared:publishToMavenLocal --quiet

      - name: Build Android APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          # Keep Metro root behavior aligned with iOS E2E build in this monorepo.
          # Without this, Gradle bundle tasks can resolve --entry-file from repo root
          # instead of app/index.js and produce a bad JS bundle in the APK.
          EXPO_NO_METRO_WORKSPACE_ROOT: 1
        run: |
          echo "Building Android APK..."
          echo "DIDIT_E2E_BYPASS=${DIDIT_E2E_BYPASS}"
          echo "EXPO_NO_METRO_WORKSPACE_ROOT=${EXPO_NO_METRO_WORKSPACE_ROOT}"
          chmod +x app/android/gradlew

          # Resource monitor so we have memory data if the build is killed
          (
            while true; do
              ts="$(date -u +%H:%M:%S)"
              mem="$(free -h | awk '/^Mem:/{print "used="$3" free="$4" avail="$7}')"
              cg_cur="$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo n/a)"
              cg_max="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
              echo "[gradle-monitor] ${ts} | ${mem} | cgroup=${cg_cur}/${cg_max}"
              sleep 30
            done
          ) &
          MONITOR_PID=$!
          trap 'kill "${MONITOR_PID}" 2>/dev/null || true' EXIT

          build_attempt() {
            (
              cd app/android &&
              E2E_BUILD=true ./gradlew assembleDebug -PbundleInDebug=true -PreactNativeArchitectures=x86_64 --quiet --build-cache --no-configuration-cache
            )
          }

          BUILD_OK=false
          for attempt in 1 2; do
            echo "Gradle build attempt ${attempt}/2..."
            if build_attempt; then
              BUILD_OK=true
              break
            fi
            echo "⚠️ Gradle build failed on attempt ${attempt}."
            if [ "${attempt}" -lt 2 ]; then
              echo "Stopping Gradle daemon and retrying in 15s..."
              (cd app/android && ./gradlew --stop) || true
              sleep 15
            fi
          done

          kill "${MONITOR_PID}" 2>/dev/null || true
          if [ "${BUILD_OK}" != "true" ]; then
            echo "❌ Android build failed after retries"
            exit 1
          fi
          echo "✅ Android build succeeded"

      - name: Save Android APK cache
        if: steps.apk-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}

      - name: Clean up Gradle build artifacts
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cleanup-gradle-artifacts
      - name: Verify APK and android-passport-nfc-reader integration
        env:
          SELFXYZ_APP_TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          echo "🔍 Verifying build artifacts..."
          APK_PATH="app/android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK_PATH" ] || { echo "❌ APK not found at $APK_PATH"; exit 1; }
          echo "✅ APK found at $APK_PATH"

          # Check APK size
          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH" 2>/dev/null || echo "unknown")
          echo "📱 APK size: $APK_SIZE bytes"

          # Verify the JS bundle inside the APK is Hermes bytecode, not plain JS.
          # A Hermes-enabled APK that ships a non-Hermes bundle will launch but
          # fail to mount JS — exactly the failure mode where Maestro never sees
          # `home-screen-root`. We identify Hermes by its bytecode magic number
          # (first 8 bytes), which is a compile-time constant that has never
          # changed across Hermes releases — only the version field that follows
          # it does. This needs no hermesc binary, so it is independent of the
          # runner OS and of where yarn hoists hermes-compiler.
          echo "🔍 Inspecting JS bundle format in APK..."
          BUNDLE_TMP=$(mktemp)
          if unzip -p "$APK_PATH" assets/index.android.bundle > "$BUNDLE_TMP" 2>/dev/null && [ -s "$BUNDLE_TMP" ]; then
            BUNDLE_SIZE=$(stat -f%z "$BUNDLE_TMP" 2>/dev/null || stat -c%s "$BUNDLE_TMP" 2>/dev/null || echo "unknown")
            echo "📦 index.android.bundle size: $BUNDLE_SIZE bytes"
            # Hermes bytecode header: bytes 0-7 = magic 0x1F1903C103BC1FC6
            # (little-endian on disk), bytes 8-11 = uint32 bytecode version.
            HERMES_MAGIC="c61fbc03c103191f"
            MAGIC=$(od -An -N8 -tx1 "$BUNDLE_TMP" | tr -d ' \n')
            if [ "$MAGIC" = "$HERMES_MAGIC" ]; then
              BYTECODE_VERSION=$(od -An -j8 -N4 -tu4 "$BUNDLE_TMP" | tr -d ' \n')
              echo "✅ Bundle is Hermes bytecode${BYTECODE_VERSION:+ (version $BYTECODE_VERSION)}"
            else
              FIRST_LINE=$(head -c 200 "$BUNDLE_TMP" | tr -d '\0' | head -1)
              echo "❌ Bundle is NOT Hermes bytecode (magic mismatch)."
              echo "Expected magic: $HERMES_MAGIC"
              echo "Actual first 8 bytes: $MAGIC"
              echo "First 200 chars:"
              echo "    $FIRST_LINE"
              echo "This will cause JS to fail to mount on a Hermes-enabled APK."
              rm -f "$BUNDLE_TMP"
              exit 1
            fi
          else
            echo "❌ No assets/index.android.bundle in APK."
            echo "This job builds with E2E_BUILD=true and -PbundleInDebug=true,"
            echo "so a missing bundle means the bundling task was skipped or failed."
            rm -f "$BUNDLE_TMP"
            exit 1
          fi
          rm -f "$BUNDLE_TMP"

          # Verify private modules were properly integrated (skip for forks)
          if [ -z "${SELFXYZ_APP_TOKEN:-}" ]; then
            echo "🔕 No SELFXYZ_APP_TOKEN available — skipping private module verification"
          else
            # Verify android-passport-nfc-reader
            if [ -d "app/android/android-passport-nfc-reader" ]; then
              echo "✅ android-passport-nfc-reader directory exists"
              echo "📁 android-passport-nfc-reader contents:"
              ls -la app/android/android-passport-nfc-reader/ | head -10
            else
              echo "❌ android-passport-nfc-reader directory not found"
              exit 1
            fi

            # Verify react-native-passport-reader
            if [ -d "app/android/react-native-passport-reader" ]; then
              echo "✅ react-native-passport-reader directory exists"
              echo "📁 react-native-passport-reader contents:"
              ls -la app/android/react-native-passport-reader/ | head -10
            else
              echo "❌ react-native-passport-reader directory not found"
              exit 1
            fi
          fi

          echo "🎉 Build verification completed successfully!"
      - name: Check KVM access
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm not found — emulator will run in software mode (slow). Enable nested virtualization for better performance."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -w /dev/kvm ]; then
            echo "✅ /dev/kvm is already writable"
          elif [ -d /etc/udev/rules.d ]; then
            echo "Setting KVM permissions via udev..."
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No udev available, setting /dev/kvm permissions directly..."
            sudo chmod 666 /dev/kvm
          fi
          ls -la /dev/kvm
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-6 libgl1 libpulse0 libnss3 \
            libxcomposite1 libxcursor1 libxi6 libxtst6 \
            libxrandr2 libxss1 libxdamage1 libxfixes3 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libgtk-3-0 libpango-1.0-0 libcairo2 \
            > /dev/null 2>&1
      - name: Create E2E test script
        run: |
          cat > /tmp/run-e2e.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          APP_ID="com.proofofpassportapp"
          echo "Installing app on emulator..."
          APK_PATH="app/android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK_PATH" ] || { echo "❌ APK not found at $APK_PATH"; exit 1; }
          adb uninstall "$APP_ID" >/dev/null 2>&1 || true
          adb install -r "$APK_PATH" || { echo "❌ App installation failed"; exit 1; }
          adb shell pm clear "$APP_ID" >/dev/null 2>&1 || true
          echo "✅ App installed successfully"
          adb logcat -c || true
          echo "⏰ Giving the emulator a moment to settle..."
          sleep 5
          echo "🎭 Running Maestro tests..."
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          export LAUNCH_WAIT_MS=180000
          if ! maestro test app/tests/e2e/launch.android.flow.yaml --format junit --output app/maestro-results.xml; then
            echo "❌ Maestro failed - dumping Android diagnostics"
            adb shell dumpsys activity activities | sed -n '1,240p' || true
            adb logcat -d > app/maestro-android-logcat.log || true
            grep -En "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|com.proofofpassportapp" app/maestro-android-logcat.log | tail -n 300 || true
            adb exec-out screencap -p > app/maestro-android-failure.png || true
            exit 1
          fi
          EOF
          chmod +x /tmp/run-e2e.sh
      - name: Install and Test on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: default
          channel: stable
          force-avd-creation: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 4096 -cores 4
            ${{ steps.kvm.outputs.available == 'true' && '-accel on' || '-accel off' }}
          disable-animations: true
          script: /tmp/run-e2e.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-android
          path: |
            app/maestro-results.xml
            app/maestro-android-logcat.log
            app/maestro-android-failure.png
          if-no-files-found: warn

  e2e-ios:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(fromJSON('["refs/heads/staging","refs/heads/main"]'), github.ref)) ||
      (github.event_name == 'pull_request' && contains(fromJSON('["staging","main"]'), github.base_ref)) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-e2e')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-ios'))
    timeout-minutes: 120
    # runs-on: macos-latest-large
    runs-on: namespace-profile-apple-silicon-6cpu
    concurrency:
      group: ${{ github.workflow }}-ios-${{ github.ref }}
      cancel-in-progress: true
    env:
      # iOS project configuration - hardcoded for E2E testing stability
      # mobile-deploy.yml uses secrets for production deployment
      IOS_PROJECT_NAME: "Self"
      IOS_PROJECT_SCHEME: "Self"
      IOS_SIMULATOR_DEVICE: "iPhone SE (3rd generation)"
      IOS_SIMULATOR_RUNTIME: "18.4"
    steps:
      - uses: actions/checkout@v6
      - name: Read and sanitize Node.js version
        shell: bash
        run: |
          if [ ! -f .nvmrc ] || [ -z "$(cat .nvmrc)" ]; then
            echo "❌ .nvmrc is missing or empty"; exit 1;
          fi
          VERSION="$(tr -d '\r\n' < .nvmrc)"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid .nvmrc content: '$VERSION'"; exit 1;
          fi
          echo "NODE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NODE_VERSION_SANITIZED=${VERSION//\//-}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm
        with:
          cache-version: ${{ env.GH_CACHE_VERSION }}-node-${{ env.NODE_VERSION_SANITIZED }}
      - name: Check Java installation
        run: |
          echo "INSTALL_JAVA=false" >> "$GITHUB_ENV"
          if command -v java &> /dev/null && java -version &> /dev/null; then
            echo "Java already installed: $(java -version 2>&1 | head -n 1)"
          else
            echo "Java not found or not working, will install..."
            echo "INSTALL_JAVA=true" >> "$GITHUB_ENV"
          fi
      - name: Setup Java environment
        if: env.INSTALL_JAVA == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Generate token for self repositories
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: ./.github/actions/generate-github-token
        id: github-token
        with:
          app-id: ${{ vars.GH_WORKFLOWS_CROSS_ACCESS_ID }}
          private-key: ${{ secrets.GH_WORKFLOWS_CROSS_ACCESS_KEY }}
          configure-netrc: "true"
      - name: Check for nested require() in tests
        uses: ./.github/actions/check-nested-requires
        with:
          paths: |
            app/tests/
      - name: Install deps (internal PRs and protected branches)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 5
          command: pnpm install --frozen-lockfile --reporter=silent
        env:
          SELFXYZ_APP_TOKEN: ${{ steps.github-token.outputs.token }}
      - name: Install deps (forked PRs - no secrets)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 5
          command: pnpm install --frozen-lockfile --reporter=silent
      - name: Validate Maestro test file
        run: |
          [ -f app/tests/e2e/launch.ios.flow.yaml ] || { echo "❌ iOS E2E test file missing"; exit 1; }
      - name: Cache Maestro
        id: cache-maestro
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro-${{ env.MAESTRO_VERSION }}-${{ env.MAESTRO_CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-maestro-${{ env.MAESTRO_VERSION }}-
      - name: Validate Maestro cache
        if: steps.cache-maestro.outputs.cache-hit == 'true'
        run: |
          echo "✅ Maestro restored from cache"
          echo "Validating cached Maestro installation..."

          if [ ! -f "$HOME/.maestro/bin/maestro" ]; then
            echo "❌ Maestro binary not found in cache - cache is corrupted"
            echo "Clearing corrupted cache..."
            rm -rf ~/.maestro
            echo "MAESTRO_CACHE_VALID=false" >> $GITHUB_ENV
          else
            echo "✅ Maestro binary found in cache"
            # Test if Maestro is executable
            if "$HOME/.maestro/bin/maestro" --version &>/dev/null; then
              echo "✅ Maestro cache is valid"
              echo "MAESTRO_CACHE_VALID=true" >> $GITHUB_ENV
            else
              echo "❌ Maestro binary is not executable - cache is corrupted"
              echo "Clearing corrupted cache..."
              rm -rf ~/.maestro
              echo "MAESTRO_CACHE_VALID=false" >> $GITHUB_ENV
            fi
          fi
      - name: Install Maestro
        if: steps.cache-maestro.outputs.cache-hit != 'true' || env.MAESTRO_CACHE_VALID == 'false'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to path
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Verify Maestro installation
        run: |
          echo "🔍 Verifying Maestro installation..."
          echo "Maestro path: $(which maestro)"
          echo "Maestro version:"
          maestro --version || {
            echo "❌ Maestro installation verification failed"
            echo "Maestro binary location:"
            find ~/.maestro -name maestro -type f 2>/dev/null || echo "No maestro binary found"
            echo ""
            echo "To fix: Bump MAESTRO_CACHE_VERSION in workflow file"
            exit 1
          }
          echo "✅ Maestro installation verified"
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Configure Xcode path
        run: |
          echo "🔧 Configuring Xcode path to fix iOS SDK issues..."
          # Fix for macOS 15 runner iOS SDK issues
          # See: https://github.com/actions/runner-images/issues/12758
          sudo xcode-select --switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
          echo "✅ Xcode path configured"

          # Verify Xcode setup
          echo "Xcode version:"
          xcodebuild -version
          echo "Xcode path:"
          xcode-select -p
      # Temporarily disabled ccache to debug CI issues
      # - name: Setup ccache
      #   uses: hendrikmuhs/ccache-action@v1.2
      #   with:
      #     key: ${{ github.job }}-${{ runner.os }}
      # - name: Add ccache to PATH
      #   run: echo "/usr/local/opt/ccache/libexec" >> $GITHUB_PATH
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app
      - name: Cache Pods
        uses: ./.github/actions/cache-pods
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          lockfile: app/ios/Podfile.lock
      # DerivedData caching disabled - caused intermittent build failures due to stale cache
      # Pod caching still speeds up pod install significantly
      - name: Verify iOS Runtime
        run: |
          echo "📱 Verifying iOS Runtime availability..."

          # Check simctl availability (simctl without args returns non-zero, so check if tool exists)
          SIMCTL_PATH=$(xcrun -f simctl 2>/dev/null || echo "")
          if [ -z "$SIMCTL_PATH" ] || [ ! -f "$SIMCTL_PATH" ]; then
            echo "❌ simctl binary not found"
            exit 1
          fi

          # Ensure simulator directories exist (required for Namespace runners)
          mkdir -p "$HOME/Library/Developer/CoreSimulator/Devices"
          mkdir -p "$HOME/Library/Developer/CoreSimulator/Caches"

          echo "📱 Available iOS runtimes:"
          xcrun simctl list runtimes | grep iOS
      - name: Build dependencies (outside main flow)
        run: |
          echo "Building dependencies..."
          pnpm --filter @selfxyz/mobile-app run build:deps || { echo "❌ Dependency build failed"; exit 1; }
          echo "✅ Dependencies built successfully"
      - name: Install iOS dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            cd app/ios
            echo "DIDIT_E2E_BYPASS=${DIDIT_E2E_BYPASS}"
            echo "📦 Installing pods via centralized script…"
            BUNDLE_GEMFILE=../Gemfile bundle exec bash scripts/pod-install-with-cache-fix.sh
        env:
          RCT_BUILD_HERMES_FROM_SOURCE: "false"
          SELFXYZ_APP_TOKEN: ${{ steps.github-token.outputs.token }}
          E2E_TESTING: 1
      - name: Resolve iOS workspace
        run: |
          WORKSPACE_PATH="app/ios/Self.xcworkspace"
          echo "WORKSPACE_PATH=$WORKSPACE_PATH" >> "$GITHUB_ENV"
          echo "Resolved workspace: $WORKSPACE_PATH"
      - name: Find iOS Simulator
        id: find-ios-simulator
        uses: ./.github/actions/find-ios-simulator
        with:
          preferred-device: ${{ env.IOS_SIMULATOR_DEVICE }}
          preferred-runtime: ${{ env.IOS_SIMULATOR_RUNTIME }}
          workspace: ${{ env.WORKSPACE_PATH }}
          scheme: ${{ env.IOS_PROJECT_SCHEME }}
      - name: Setup iOS Simulator
        run: |
          echo "Setting up iOS Simulator..."

          # Ensure simulator directories exist
          mkdir -p "$HOME/Library/Developer/CoreSimulator/Devices"
          wait_for_simulator() {
            local simulator_id="$1"
            for attempt in {1..24}; do
              if xcrun simctl spawn "$simulator_id" launchctl print system >/dev/null 2>&1; then
                return 0
              fi
              echo "Simulator not ready yet (attempt $attempt/24)..."
              sleep 5
            done
            return 1
          }

          echo "Available simulators:"
          xcrun simctl list devices available

          SIMULATOR_ID="${{ steps.find-ios-simulator.outputs.id }}"
          SIMULATOR_NAME="${{ steps.find-ios-simulator.outputs.name }}"
          SIMULATOR_RUNTIME="${{ steps.find-ios-simulator.outputs.runtime }}"

          if [ -z "$SIMULATOR_ID" ]; then
            echo "❌ No matching iPhone simulator found for ${IOS_SIMULATOR_DEVICE} on iOS ${IOS_SIMULATOR_RUNTIME}"
            exit 1
          fi

          echo "Using simulator: $SIMULATOR_NAME ($SIMULATOR_ID) [$SIMULATOR_RUNTIME]"
          echo "Resetting simulator to a clean state before boot..."
          xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl erase "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

          echo "Waiting for simulator services to be ready..."
          wait_for_simulator "$SIMULATOR_ID" || {
            echo "❌ Simulator failed readiness checks"
            exit 1
          }

          echo "Simulator status:"
          xcrun simctl list devices | grep "$SIMULATOR_ID"

          echo "IOS_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_RUNTIME=$SIMULATOR_RUNTIME" >> "$GITHUB_ENV"
      - name: Build iOS App
        env:
          E2E_TESTING: 1
          # Expo's metro-config sets Metro's serverRoot to the yarn workspace
          # root by default. Under Xcode's bundle phase, --entry-file is then
          # resolved against the repo root (self/self/index.js) instead of
          # app/index.js. Opt out so Metro anchors to projectRoot.
          EXPO_NO_METRO_WORKSPACE_ROOT: 1
        run: |
          echo "Building iOS app..."
          echo "Project: ${{ env.IOS_PROJECT_NAME }}, Scheme: ${{ env.IOS_PROJECT_SCHEME }}"

          # Verify workspace exists before building
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "❌ WORKSPACE_PATH is not set"
            exit 1
          fi
          if [ ! -d "$WORKSPACE_PATH" ]; then
            echo "❌ Workspace not found at: $WORKSPACE_PATH"
            echo "Available workspaces:"
            find app/ios -name "*.xcworkspace" -type d
            exit 1
          fi

          # Verify scheme exists by listing available schemes
          echo "Verifying scheme availability..."
          AVAILABLE_SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE_PATH" 2>/dev/null | grep -A 200 "Schemes:" | grep -v "Schemes:" | xargs)
          echo "Available schemes (first 20): $(echo $AVAILABLE_SCHEMES | cut -d' ' -f1-20)..."

          if [[ ! "$AVAILABLE_SCHEMES" =~ ${{ env.IOS_PROJECT_SCHEME }} ]]; then
            echo "❌ Scheme '${{ env.IOS_PROJECT_SCHEME }}' not found"
            echo "Full scheme list:"
            xcodebuild -list -workspace "$WORKSPACE_PATH" 2>/dev/null | grep -A 200 "Schemes:" | grep -v "Schemes:" | head -50
            exit 1
          fi

          echo "✅ Using workspace: $WORKSPACE_PATH"
          echo "✅ Using scheme: ${{ env.IOS_PROJECT_SCHEME }}"

          # Use cached derived data and enable parallel builds for faster compilation
          # Additional flags disable indexing, restrict architecture, and use whole-module Swift compilation
          # Use the simulator that was set up earlier in the workflow
          # E2E_TESTING compilation condition excludes NFCPassportReader which isn't available on simulator
          FORCE_BUNDLING=1 RCT_NO_LAUNCH_PACKAGER=1 \
            xcodebuild -workspace "$WORKSPACE_PATH" -scheme ${{ env.IOS_PROJECT_SCHEME }} -configuration Debug -destination "id=${{ env.IOS_SIMULATOR_ID }}" -derivedDataPath app/ios/build -jobs "$(sysctl -n hw.ncpu)" -parallelizeTargets -quiet COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES SWIFT_COMPILATION_MODE=wholemodule 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) E2E_TESTING' || { echo "❌ iOS build failed"; exit 1; }
          echo "✅ iOS build succeeded"
      - name: Install and Test on iOS
        continue-on-error: true
        id: maestro-test
        run: |
          wait_for_app_install() {
            local simulator_id="$1"
            local bundle_id="$2"
            for attempt in {1..12}; do
              if xcrun simctl get_app_container "$simulator_id" "$bundle_id" app >/dev/null 2>&1; then
                return 0
              fi
              echo "App container not ready yet (attempt $attempt/12)..."
              sleep 5
            done
            return 1
          }

          run_maestro() {
            MAESTRO_DEVICE_ID="$SIMULATOR_ID" \
            MAESTRO_DRIVER_STARTUP_TIMEOUT=180000 \
            maestro test app/tests/e2e/launch.ios.flow.yaml --format junit --output app/maestro-results.xml 2>&1
          }

          echo "Installing app on simulator..."
          APP_PATH=$(find app/ios/build/Build/Products/Debug-iphonesimulator -name "*.app" | head -1)
          [ -z "$APP_PATH" ] && { echo "❌ Could not find built iOS app"; exit 1; }
          echo "Found app at: $APP_PATH"

          echo "🔍 Determining app bundle ID from built app..."
          IOS_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist")
          [ -z "$IOS_BUNDLE_ID" ] && { echo "❌ Could not determine bundle ID from $APP_PATH/Info.plist"; exit 1; }
          echo "✅ App Bundle ID: $IOS_BUNDLE_ID"

          # Use the dynamic simulator ID
          SIMULATOR_ID="${IOS_SIMULATOR_ID:-iPhone SE (3rd generation)}"
          echo "Installing on simulator: $SIMULATOR_ID"

          echo "Removing any existing app installation..."
          xcrun simctl uninstall "$SIMULATOR_ID" "$IOS_BUNDLE_ID" 2>/dev/null || true

          echo "Installing app..."
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          if [ $? -ne 0 ]; then
            echo "❌ iOS app installation failed"
            exit 1
          fi

          echo "Verifying app installation..."
          # get_app_container may fail with NSPOSIXErrorDomain if app isn't ready yet - handle gracefully
          APP_CONTAINER_OUTPUT=$(xcrun simctl get_app_container "$SIMULATOR_ID" "$IOS_BUNDLE_ID" app 2>&1) || APP_CONTAINER_EXIT=$?
          if [ -z "${APP_CONTAINER_EXIT:-}" ] && [ -n "$APP_CONTAINER_OUTPUT" ]; then
            echo "✅ App successfully installed at: $APP_CONTAINER_OUTPUT"
          else
            echo "⚠️ App installation verification returned exit code ${APP_CONTAINER_EXIT:-unknown} (may be expected)"
            # Check if app appears in installed apps list as fallback
            xcrun simctl listapps "$SIMULATOR_ID" 2>/dev/null | grep -i "$IOS_BUNDLE_ID" || echo "App not found in installed apps list"
          fi
          unset APP_CONTAINER_OUTPUT APP_CONTAINER_EXIT

          echo "🚀 Testing app launch capability..."
          xcrun simctl launch "$SIMULATOR_ID" "$IOS_BUNDLE_ID" || {
            echo "⚠️ Direct app launch test failed - this might be expected."
          }

          echo "⏰ Checking simulator readiness..."
          wait_for_app_install "$SIMULATOR_ID" "$IOS_BUNDLE_ID" || echo "⚠️ App container readiness check timed out"

          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                  🔍 PRE-TEST DIAGNOSTICS                       ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""

          # Create directory for test artifacts
          mkdir -p app/test-artifacts

          # Check Maestro version and health
          echo "📦 Maestro installation details:"
          echo "Binary location: $(which maestro)"
          echo "Maestro version:"
          maestro --version || {
            echo "❌ Failed to get Maestro version"
            echo "This is a critical error - Maestro is not working"
            exit 1
          }
          echo ""

          # Check Java (required by Maestro)
          echo "☕ Java status (required by Maestro):"
          if command -v java &>/dev/null; then
            java -version 2>&1 | head -3
            echo "✅ Java is available"
          else
            echo "⚠️ Java not found - this may cause Maestro to fail"
          fi
          echo ""

          # Check simulator state
          echo "📱 Simulator state:"
          xcrun simctl list devices | grep -A 2 "$SIMULATOR_ID" || echo "⚠️ Simulator not found"
          echo ""

          # Check if app is installed
          echo "📲 Checking app installation:"
          xcrun simctl listapps "$SIMULATOR_ID" | grep -i "$IOS_BUNDLE_ID" && echo "✅ App is installed" || echo "⚠️ App not found in installed apps"
          echo ""

          # Check if app is running
          echo "🏃 Checking if app is running:"
          APP_PID=$(xcrun simctl spawn "$SIMULATOR_ID" launchctl list | grep "$IOS_BUNDLE_ID" | awk '{print $1}' || echo "")
          if [ -n "$APP_PID" ]; then
            echo "✅ App process found (PID: $APP_PID)"
          else
            echo "ℹ️ App not currently running (will be launched by Maestro)"
          fi
          echo ""

          # Verify test file
          echo "📄 Maestro test file:"
          if [ -f "app/tests/e2e/launch.ios.flow.yaml" ]; then
            echo "✅ Found: app/tests/e2e/launch.ios.flow.yaml"
            echo "Contents:"
            cat app/tests/e2e/launch.ios.flow.yaml
          else
            echo "❌ Test file not found"
          fi
          echo ""

          # Note: Maestro 1.41.0 doesn't have daemon or devices commands
          # The test command handles daemon management internally
          echo "🔧 Maestro will manage its daemon automatically during test execution"
          echo ""

          # Always take a pre-test screenshot — cheap, and essential when the app hangs on launch.
          echo "📸 Taking pre-test screenshot..."
          xcrun simctl io "$SIMULATOR_ID" screenshot app/test-artifacts/pre-test-screenshot.png || echo "⚠️ Screenshot failed"
          echo ""

          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                  🎭 STARTING MAESTRO TEST                      ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""

          # Start native simulator recording BEFORE running tests (if recording enabled)
          # This ensures we capture everything even if Maestro fails immediately
          if [ "${ENABLE_MAESTRO_RECORDING}" = "true" ]; then
            echo "📹 Starting native simulator recording..."
            xcrun simctl io "$SIMULATOR_ID" recordVideo --codec=h264 app/test-artifacts/simulator-recording.mp4 &
            RECORDING_PID=$!
            echo "✅ Recording started (PID: $RECORDING_PID)"

            # Give recording a moment to initialize
            sleep 2
          else
            echo "ℹ️ Maestro recording disabled (ENABLE_MAESTRO_RECORDING=false)"
          fi

          # Run Maestro with verbose output and capture all output (including errors)
          echo "🎭 Starting Maestro test with verbose logging..."
          echo "Command: maestro test app/tests/e2e/launch.ios.flow.yaml --format junit --output app/maestro-results.xml"
          echo "Environment variables:"
          echo "  MAESTRO_DEVICE_ID: $SIMULATOR_ID"
          echo "  MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000"
          echo "  MAESTRO_CLI_NO_ANALYTICS: $MAESTRO_CLI_NO_ANALYTICS"
          echo "  Working directory: $(pwd)"
          echo ""

          set +e  # Don't exit on error
          # Run with explicit device ID, increased timeout, and retry once for known startup flakes.
          MAESTRO_OUTPUT=$(run_maestro)
          MAESTRO_EXIT_CODE=$?
          if [ $MAESTRO_EXIT_CODE -ne 0 ] && printf '%s' "$MAESTRO_OUTPUT" | grep -Eq "MaestroDriverStartupException|IOSDriverTimeoutException"; then
            echo "⚠️ Maestro driver startup failed, retrying once after 30s..."
            sleep 30
            MAESTRO_OUTPUT_RETRY=$(run_maestro)
            MAESTRO_EXIT_CODE=$?
            MAESTRO_OUTPUT=$(printf '%s\n\n===== RETRY AFTER DRIVER STARTUP FAILURE =====\n\n%s' "$MAESTRO_OUTPUT" "$MAESTRO_OUTPUT_RETRY")
          elif [ $MAESTRO_EXIT_CODE -ne 0 ] && printf '%s' "$MAESTRO_OUTPUT" | grep -Eq "App crashed or stopped while executing flow"; then
            echo "⚠️ App crashed during Maestro flow, retrying once after 20s..."
            sleep 20
            MAESTRO_OUTPUT_RETRY=$(run_maestro)
            MAESTRO_EXIT_CODE=$?
            MAESTRO_OUTPUT=$(printf '%s\n\n===== RETRY AFTER APP CRASH =====\n\n%s' "$MAESTRO_OUTPUT" "$MAESTRO_OUTPUT_RETRY")
          fi
          set -e

          echo "Maestro command completed with exit code: $MAESTRO_EXIT_CODE"
          echo ""

          # Stop the simulator recording (if recording was started)
          if [ "${ENABLE_MAESTRO_RECORDING}" = "true" ] && [ -n "${RECORDING_PID:-}" ]; then
            echo ""
            echo "🛑 Stopping recording..."
            kill -SIGINT $RECORDING_PID 2>/dev/null || true
            wait $RECORDING_PID 2>/dev/null || true
            sleep 2  # Give time for video to finalize
          fi

          # Always take a post-test screenshot — captures the final on-screen state for triage.
          echo "📸 Taking post-test screenshot..."
          xcrun simctl io "$SIMULATOR_ID" screenshot app/test-artifacts/post-test-screenshot.png || echo "⚠️ Screenshot failed"
          echo ""

          # Save Maestro output to file for debugging
          echo "$MAESTRO_OUTPUT" > app/test-artifacts/maestro-output.log
          echo "📝 Maestro output saved to maestro-output.log"

          # Show Maestro output
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                     📋 MAESTRO OUTPUT                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo "$MAESTRO_OUTPUT"
          echo ""

          # Post-test diagnostics
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                  🔍 POST-TEST DIAGNOSTICS                      ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""

          # Check if app is still running
          echo "🏃 App status after test:"
          APP_PID_AFTER=$(xcrun simctl spawn "$SIMULATOR_ID" launchctl list | grep "$IOS_BUNDLE_ID" | awk '{print $1}' || echo "")
          if [ -n "$APP_PID_AFTER" ]; then
            echo "✅ App still running (PID: $APP_PID_AFTER)"
          else
            echo "⚠️ App not running"
          fi
          echo ""

          # Collect any recent crash / diagnostic reports from both host and simulator paths.
          # Bundle id is com.warroom.proofofpassport; binary name is OpenPassport — match broadly.
          echo "🔍 Collecting crash & diagnostic reports..."
          mkdir -p app/test-artifacts/diagnostic-reports
          CRASH_SEARCH_PATHS=(
            "$HOME/Library/Logs/DiagnosticReports"
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_ID/data/Library/Logs/DiagnosticReports"
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_ID/data/Library/Logs/CrashReporter"
          )
          CRASH_FOUND=0
          for p in "${CRASH_SEARCH_PATHS[@]}"; do
            [ -d "$p" ] || continue
            # Anything modified in the last 15 minutes — broader pattern catches .ips, .crash, .diag, .panic
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              cp "$f" app/test-artifacts/diagnostic-reports/ 2>/dev/null && CRASH_FOUND=$((CRASH_FOUND + 1))
            done < <(find "$p" -type f -mmin -15 2>/dev/null \( -iname "OpenPassport*" -o -iname "Self*" -o -iname "*proofofpassport*" -o -iname "*.ips" -o -iname "*.crash" -o -iname "*.panic" \))
          done
          if [ "$CRASH_FOUND" -gt 0 ]; then
            echo "⚠️ Copied $CRASH_FOUND diagnostic report(s) to app/test-artifacts/diagnostic-reports/"
            ls -la app/test-artifacts/diagnostic-reports/
          else
            echo "✅ No recent diagnostic reports"
          fi
          echo ""

          # Capture two views of the simulator system log:
          # 1. A filtered text log scoped to our process — quick to grep in CI output.
          # 2. A full .logarchive — the only reliable way to diagnose hangs / native crashes
          #    when the process name predicate misses (e.g. early launch, jetsam, watchdog kills).
          echo "📋 Capturing simulator system logs..."
          xcrun simctl spawn "$SIMULATOR_ID" log show \
            --predicate 'process == "OpenPassport" OR process == "Self" OR senderImagePath CONTAINS "OpenPassport" OR subsystem CONTAINS "proofofpassport"' \
            --last 10m --style compact 2>/dev/null \
            > app/test-artifacts/simulator-system.log \
            || echo "⚠️ Filtered log show failed"
          if [ -s app/test-artifacts/simulator-system.log ]; then
            echo "✅ Filtered system log saved (last 20 lines):"
            tail -20 app/test-artifacts/simulator-system.log
          else
            echo "⚠️ Filtered log empty — process predicate may not have matched. The full archive below is the source of truth."
          fi
          echo ""

          echo "📦 Collecting full simulator log archive (sim.logarchive)..."
          xcrun simctl spawn "$SIMULATOR_ID" log collect --output app/test-artifacts/sim.logarchive 2>/dev/null \
            && echo "✅ Log archive saved to sim.logarchive" \
            || echo "⚠️ log collect failed (sim may have shut down)"
          # Also dump an unfiltered tail so CI viewers don't have to download the archive
          # for quick triage. Bounded so it doesn't bloat artifacts.
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 5m --style compact 2>/dev/null \
            | tail -2000 > app/test-artifacts/simulator-system-unfiltered.log \
            || echo "⚠️ Unfiltered log show failed"
          echo ""

          # Check if video was created (if recording was enabled)
          if [ "${ENABLE_MAESTRO_RECORDING}" = "true" ]; then
            if [ -f "app/test-artifacts/simulator-recording.mp4" ]; then
              VIDEO_SIZE=$(ls -lh app/test-artifacts/simulator-recording.mp4 | awk '{print $5}')
              echo "✅ Video recording saved: simulator-recording.mp4 ($VIDEO_SIZE)"
              echo ""
              echo "📹 ===================================================="
              echo "📹 VIDEO RECORDING AVAILABLE"
              echo "📹 ===================================================="
              echo "📹 To view the test recording:"
              echo "📹 1. Go to: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "📹 2. Scroll to the 'Artifacts' section at the bottom"
              echo "📹 3. Download 'maestro-artifacts-ios'"
              echo "📹 4. Extract and open 'simulator-recording.mp4'"
              echo "📹 ===================================================="
              echo ""
            else
              echo "⚠️ Video recording not created"
            fi
          else
            echo "ℹ️ Video recording disabled (ENABLE_MAESTRO_RECORDING=false)"
          fi

          # Analyze test results
          echo "🔍 Analyzing test results..."
          echo "Maestro exit code: $MAESTRO_EXIT_CODE"

          # Check if tests actually passed (ignore cleanup errors)
          if echo "$MAESTRO_OUTPUT" | grep -q "Flow Passed"; then
            echo "✅ Maestro tests passed"
            # Suppress harmless cleanup errors (NSPOSIXErrorDomain code=3)
            if [ $MAESTRO_EXIT_CODE -ne 0 ] && echo "$MAESTRO_OUTPUT" | grep -q "NSPOSIXErrorDomain.*code=3.*terminate"; then
              echo "⚠️ Maestro cleanup warning (harmless): Test runner termination error"
            elif [ $MAESTRO_EXIT_CODE -ne 0 ]; then
              echo "❌ Maestro test failed with exit code: $MAESTRO_EXIT_CODE"
              exit 1
            fi
          elif echo "$MAESTRO_OUTPUT" | grep -q "Flow Failed"; then
            echo "❌ Maestro tests failed"
            echo "Check the video recording and maestro-output.log for details"
            exit 1
          elif [ $MAESTRO_EXIT_CODE -ne 0 ]; then
            # Check results file if exit code is non-zero
            if [ -f "app/maestro-results.xml" ] && ! grep -q "<failure" app/maestro-results.xml; then
              echo "✅ Tests passed (cleanup error caused non-zero exit)"
            else
              echo "❌ Maestro test failed with exit code: $MAESTRO_EXIT_CODE"
              echo "Check the video recording and maestro-output.log for details"
              exit 1
            fi
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-ios
          path: app/maestro-results.xml
          if-no-files-found: warn
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-logs-ios
          path: |
            app/test-artifacts/maestro-output.log
            app/test-artifacts/simulator-system.log
            app/test-artifacts/simulator-system-unfiltered.log
            app/test-artifacts/diagnostic-reports/**
          if-no-files-found: warn
      # Always upload the full artifacts bundle (video, screenshots, log archive,
      # diagnostic reports). The archive is bounded by retention-days, and the
      # diagnosability ROI on every failed run is higher than the storage cost.
      - name: Upload test artifacts (video, screenshots, log archive)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-ios
          path: app/test-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Artifact download instructions
        if: always() && env.ENABLE_MAESTRO_RECORDING == 'true'
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    📹 TEST ARTIFACTS UPLOADED                  ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Artifact name: maestro-artifacts-ios"
          echo "🎬 Contains:"
          echo "   📹 simulator-recording.mp4 - Full video of simulator during test"
          echo "   📝 maestro-output.log - Complete Maestro command output"
          echo "   📋 simulator-system.log - iOS simulator system logs"
          echo "   📸 pre-test-screenshot.png - Simulator state before test"
          echo "   📸 post-test-screenshot.png - Simulator state after test"
          echo "   📊 maestro-results.xml - Test results (if generated)"
          echo "   💥 *.crash - Crash logs (if any crashes occurred)"
          echo "⏰ Retention: 7 days"
          echo ""
          echo "🔗 Direct link to this run:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "💡 How to download:"
          echo "   1. Click the link above (or find this run in the Actions tab)"
          echo "   2. Scroll down to the 'Artifacts' section"
          echo "   3. Click 'maestro-artifacts-ios' to download the ZIP"
          echo "   4. Extract and review:"
          echo "      🎬 Play simulator-recording.mp4 to see what happened"
          echo "      📝 Read maestro-output.log for Maestro errors"
          echo "      📋 Check simulator-system.log for iOS system errors"
          echo "      📸 Compare pre/post screenshots to see UI state"
          echo "      💥 Review crash logs if app crashed"
          echo ""
          echo "📝 Alternative - Using GitHub CLI:"
          echo "   gh run download ${{ github.run_id }} -n maestro-artifacts-ios"
          echo ""

          # List what files were actually created
          echo "📂 Files in test-artifacts directory:"
          ls -lh app/test-artifacts/ 2>/dev/null || echo "   (No artifacts directory found)"
          echo ""
      - name: Fail job if tests failed
        if: steps.maestro-test.outcome == 'failure'
        run: |
          echo "❌ Maestro tests failed - failing job after artifact upload"
          exit 1
